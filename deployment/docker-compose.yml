
services:
  db:
    image: postgres:15-alpine
    container_name: portfolio_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: portfoliodb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d portfoliodb"]
      interval: 5s
      timeout: 5s
      retries: 5
  seq-service:
    image: datalust/seq:latest
    container_name: portfolio_seq
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_ADMINPASSWORD=${SEQ_FIRSTRUN_ADMINPASSWORD}
    ports:
      - "5341:80"
    restart: unless-stopped
    volumes:
      - seq_data:/data
  rustfs:
    image: rustfs/rustfs:latest 
    container_name: portfolio_rustfs
    restart: unless-stopped
    ports:
      - "9000:9000"  
      - "9001:9001"   
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: "true"
    command: ["--address", ":9000", "--console-enable", "/data"]
    volumes:
      - rustfs-data:/data

  workspace:
    image: mcr.microsoft.com/devcontainers/dotnet:10.0
    container_name: portfolio_workspace
    command: /bin/sh -c "while sleep 1000; do :; done"
    volumes:
      - ../:/workspace
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Database=portfoliodb;Username=${DB_USER:-devuser};Password=${DB_PASSWORD:-devpass}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_ENDPOINT=${S3_ENDPOINT}
    depends_on:
      db:
        condition: service_healthy
      seq-service:
        condition: service_started
      rustfs:
        condition: service_started

volumes:
  postgres_data:
  seq_data:
  rustfs-data:
